name: Build Android APK

# 手動実行と、Android に関わるファイルを触った push で走らせる。
# Android SDK は GitHub の ubuntu ランナーに同梱されているものを使う。
on:
  workflow_dispatch:
  # ネイティブ側はこの環境でコンパイルを確認できないので、PR でも走らせて
  # マージ前に Java が通ることを見る
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # APK を Release に置くため
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 の CLI は Node >= 22 を要求する
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web assets for Android
        env:
          BUILD_TARGET: capacitor
          # アプリ内の更新確認が、リリースのタグ（android-<run_number>）と比べるための番号
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npx vite build --outDir dist-android

      - name: Sync Capacitor
        run: npx cap sync android

      # 署名鍵を固定する。
      #
      # assembleDebug は ~/.android/debug.keystore で署名するが、これは無ければ
      # Gradle がその場で作る。ランナーは毎回まっさらなので、何もしないと
      # ビルドごとに違う鍵になり、上書きインストールが署名不一致で失敗する
      # （インストーラは理由を出さず「アプリがインストールされていません」とだけ言う）。
      #
      # 鍵は ANDROID_KEYSTORE_BASE64（リポジトリシークレット）に入れておく。
      # 別名・パスワードは Android のデバッグ鍵の既定値に合わせてあるので、
      # build.gradle 側の設定は要らない。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 が未設定です。ビルドごとに署名鍵が変わるため、上書きインストールできません（入れ直しが必要になります）。"
            exit 0
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey > /dev/null
          echo "固定の署名鍵を使います"

      - name: Build debug APK
        working-directory: android
        env:
          # versionCode を上げて、OS に「更新」として扱わせる（既定の 1 のままだと
          # 何を入れても同じ版に見える）。手元ビルドは 1 のまま
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      # PR では成果物として置くだけ（zip 展開が要るがビルド確認用なので十分）
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: my-forward-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # main では Release に APK そのものを置く。
      # 成果物の zip と違い、スマホのブラウザから直接タップしてインストールできる。
      # 常に下のURLが最新を指す:
      #   https://github.com/ma-garin/my_forward/releases/latest/download/app-debug.apk
      - name: Publish APK (release)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Android APK #${{ github.run_number }}" \
            --notes "main の最新ビルド（デバッグ版）。スマホのブラウザから app-debug.apk をタップしてインストールできます。"
