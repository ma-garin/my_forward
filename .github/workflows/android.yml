name: Build Android APK

# 手動実行と、Android に関わるファイルを触った push で走らせる。
# Android SDK は GitHub の ubuntu ランナーに同梱されているものを使う。
on:
  workflow_dispatch:
  # ネイティブ側はこの環境でコンパイルを確認できないので、PR でも走らせて
  # マージ前に Java が通ることを見る
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'package.json'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # APK を Release に置くため
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 の CLI は Node >= 22 を要求する
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets for Android
        env:
          BUILD_TARGET: capacitor
        run: npx vite build --outDir dist-android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # PR では成果物として置くだけ（zip 展開が要るがビルド確認用なので十分）
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: my-forward-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # main では Release に APK そのものを置く。
      # 成果物の zip と違い、スマホのブラウザから直接タップしてインストールできる。
      # 常に下のURLが最新を指す:
      #   https://github.com/ma-garin/my_forward/releases/latest/download/app-debug.apk
      - name: Publish APK (release)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Android APK #${{ github.run_number }}" \
            --notes "main の最新ビルド（デバッグ版）。スマホのブラウザから app-debug.apk をタップしてインストールできます。"
