name: Build Android APK

# 自動では走らせない。push や PR のたびには回さない。
#
# APK が要るときだけ、build-* のタグを打って回す。Actions の画面を開いて
# ボタンを押す手間をなくすため（タグ push は git だけで完結する）。
#   git tag build-$(date +%s) && git push origin build-...
on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

# 同じブランチで二重に走らせない。手動で続けて押したときのため。
# 走っているものは止めない（リリースの公開を途中で切らない）。
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 詰まったときに 6 時間（既定）居座らせない。通常は 3 分で終わる。
    # 実際に npm ci が 15 分以上進まなくなったことがある
    timeout-minutes: 20
    permissions:
      contents: write # APK を Release に置くため
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 の CLI は Node >= 22 を要求する
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web assets for Android
        env:
          BUILD_TARGET: capacitor
          # アプリ内の更新確認が、リリースのタグ（android-<run_number>）と比べるための番号
          VITE_BUILD_NUMBER: ${{ github.run_number }}
        run: npx vite build --outDir dist-android

      - name: Sync Capacitor
        run: npx cap sync android

      # 署名鍵を固定する。
      #
      # 鍵は ANDROID_KEYSTORE_BASE64（リポジトリシークレット）に入れておき、
      # ファイルに書いて ANDROID_KEYSTORE_PATH で build.gradle に明示的に渡す。
      # 以前は ~/.android/debug.keystore に置いて AGP の既定に任せていたが、
      # ランナーでは参照先がずれて使われず、毎回その場で別の鍵が生成されていた
      # （ビルド 28〜39 が全部別署名で、上書きインストールが全滅した実害）。
      # だから場所を推測に任せず、下の Verify APK signature で実物を照合する。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 が未設定です。ビルドごとに署名鍵が変わるため、上書きインストールできません（入れ直しが必要になります）。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ci-debug.keystore"
          keytool -list -keystore "$RUNNER_TEMP/ci-debug.keystore" -storepass android \
            -alias androiddebugkey > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/ci-debug.keystore" >> "$GITHUB_ENV"
          echo "固定の署名鍵を使います"

      - name: Build debug APK
        working-directory: android
        env:
          # versionCode を上げて、OS に「更新」として扱わせる（既定の 1 のままだと
          # 何を入れても同じ版に見える）。手元ビルドは 1 のまま
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon

      # 出来上がった APK の署名を実測して、固定鍵と一致しなければ落とす。
      # 「鍵を置いたつもり」が黙って無視されると、更新できない APK を
      # 配ってしまう（実際に起きた）。意図ではなく成果物を検証する。
      - name: Verify APK signature
        if: env.ANDROID_KEYSTORE_PATH != ''
        env:
          # 固定鍵の証明書の SHA-256（公開情報。APK に入る値そのもの）
          EXPECTED_CERT_SHA256: 41c0ed4eb4bce9fb7c404b4486523b2ec4724f1f6c2118684bef54905cc18dc6
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | grep 'certificate SHA-256' | head -1 | awk '{print $NF}')
          echo "expected: $EXPECTED_CERT_SHA256"
          echo "actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK の署名が固定鍵と一致しません。この APK は配布してはいけない（上書きインストールできない）"
            exit 1
          fi
          echo "署名OK: 固定鍵で署名されています"

      # PR では成果物として置くだけ（zip 展開が要るがビルド確認用なので十分）
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: my-forward-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Release に APK そのものを置く。
      # 成果物の zip と違い、スマホのブラウザから直接タップしてインストールできる。
      # 常に下のURLが最新を指す:
      #   https://github.com/ma-garin/my_forward/releases/latest/download/app-debug.apk
      - name: Publish APK (release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "android-${{ github.run_number }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Android APK #${{ github.run_number }}" \
            --notes "main の最新ビルド（デバッグ版）。スマホのブラウザから app-debug.apk をタップしてインストールできます。"
